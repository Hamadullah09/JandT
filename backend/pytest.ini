[pytest]
testpaths = tests
# The default temp base (%LOCALAPPDATA%\Temp\pytest-of-*) is not writable on
# every Windows profile; keep tmp_path inside the repo instead.
addopts = --basetemp=.pytest-tmp
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    db: needs a live PostgreSQL (skipped automatically when unreachable)
