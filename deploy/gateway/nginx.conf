# =============================================================================
# Inaaya Commerce Platform - gateway
#
# One address for the whole platform. The browser, the handhelds and the
# courier's customers all talk to this, never to a service directly:
#
#   /api/v1/*            courier API (FastAPI)     - J&T waybills, tracking, bulk import
#   /api/*               warehouse API (.NET)      - stock, orders, returns, handhelds
#   /uploads/*           warehouse API             - product photos
#   /warehouse/*         warehouse API             - the warehouse dashboard (React)
#   everything else      courier portal (Next.js)  - login, merchant + admin portal, tracking page
#
# Serving both modules on one origin is what lets them share the login cookie,
# and it removes CORS from the picture entirely.
#
# TLS: terminate HTTPS in front of this (a load balancer, Caddy, Traefik, or
# nginx with a certificate) and set COOKIE_SECURE=true. See docs/DEPLOYMENT.md.
# =============================================================================

worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  # Photo uploads go up a few at a time (the dashboard keeps each request under
  # 25 MB); bulk order CSVs are capped at 64 MB by the courier API.
  client_max_body_size 130m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # One id per request, passed to both services and logged by all three, so a
  # request can be followed from the gateway into whichever module served it.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # The address as the browser used it, port included ($host drops the port).
  # Both APIs compare a browser's Origin with it before accepting a change made
  # with the session cookie, so on :5080 it has to say localhost:5080.
  map $http_host $client_host {
    default $http_host;
    ""      $host;
  }

  log_format platform escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","client":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream":"$upstream_addr","upstream_s":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

  access_log /dev/stdout platform;
  error_log  /dev/stderr warn;

  # Sign-in attempts per client address. Generous enough for a shift of
  # handhelds signing in together behind one router; each API also limits.
  limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;

  # Docker's DNS, re-resolved every few seconds: a service that restarts with a
  # new address is found again without restarting the gateway.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80 default_server;
    server_name _;

    # Redirects say "/warehouse/", not "http://localhost/warehouse/": the gateway
    # listens on 80 inside its container but is reached on another port outside.
    absolute_redirect off;

    set $warehouse_api warehouse-api:8080;
    set $courier_api   courier-api:8000;
    set $courier_web   courier-web:3000;

    # The gateway owns the security headers. The services set the same ones for
    # when they are reached directly; hidden here so a response carries one copy.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $client_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $client_host;
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;

    # ------------------------------------------------------------- gateway
    location = /gateway/health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    # Internal service documentation and health endpoints stay internal.
    location ~ ^/(docs|redoc|openapi\.json|health)(/|$) {
      return 404;
    }

    # ------------------------------------------------------------ courier
    location = /api/v1/auth/login {
      limit_req zone=login burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://$courier_api;
    }

    location /api/v1/ {
      proxy_pass http://$courier_api;
      # Bulk imports render hundreds of waybills in one request, and the
      # progress endpoint is a server-sent event stream.
      proxy_read_timeout 600s;
      proxy_buffering off;
      # An oversized CSV is refused here, in the courier API's own error shape.
      error_page 413 = @courier_too_large;
    }

    location @courier_too_large {
      default_type application/problem+json;
      return 413 '{"type":"about:blank","title":"Upload too large","status":413,"detail":"That file is too large to upload. Bulk order files can be up to 64 MB."}';
    }

    # ---------------------------------------------------------- warehouse
    location = /api/auth/login {
      limit_req zone=login burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://$warehouse_api;
    }

    location /api/ {
      proxy_pass http://$warehouse_api;
      # Uploads (product photos, search by photo) stream straight through and
      # the warehouse API enforces its own limits: it refuses an oversized upload
      # from its declared length, before a byte of it is sent, with a sentence
      # the dashboard and the handheld show as it is. Buffering here would
      # instead wait for the whole body, then answer with an HTML page.
      client_max_body_size 0;
      proxy_request_buffering off;
    }

    location /uploads/ {
      proxy_pass http://$warehouse_api;
      expires 1d;
    }

    location = /warehouse {
      return 301 /warehouse/;
    }

    location /warehouse/ {
      proxy_pass http://$warehouse_api;
    }

    # ------------------------------------------------------ courier portal
    location / {
      proxy_pass http://$courier_web;
    }
  }
}
